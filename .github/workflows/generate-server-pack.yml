name: Generate Server Pack

on:
  repository_dispatch:
    types: [generate-server-pack]
  workflow_dispatch:
    inputs:
      modpack_id:
        description: "modpack id (ใส่อะไรก็ได้ตอนเทส)"
        required: true
      download_url:
        description: "ลิงก์ดาวน์โหลด modpack zip ตรงๆ"
        required: true
      job_id:
        description: "job id (ใส่ test-1 ก็ได้ตอนเทส)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MODPACK_ID: ${{ github.event.inputs.modpack_id || github.event.client_payload.modpack_id }}
      DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url }}
      JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download modpack
        run: |
          mkdir -p work/input work/output
          curl -L -f \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "$DOWNLOAD_URL" -o work/modpack.zip

      - name: Verify downloaded file
        run: |
          echo "ขนาดไฟล์:"
          ls -lh work/modpack.zip
          echo "ประเภทไฟล์จริง:"
          file work/modpack.zip

      - name: Extract modpack
        run: unzip -q work/modpack.zip -d work/input

      - name: Generate SPC config from manifest
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const inputDir = path.resolve('work/input');
            const m = require(path.join(inputDir, 'manifest.json'));
            const loaderRaw = m.minecraft.modLoaders[0].id;
            const [loaderName, ...verParts] = loaderRaw.split('-');
            const loaderVersion = verParts.join('-');
            const loaderCap = loaderName.charAt(0).toUpperCase() + loaderName.slice(1);

            const dirs = ['config', 'mods', 'scripts', 'defaultconfigs']
              .filter((dir) => fs.existsSync(path.join(inputDir, dir)));

            if (!dirs.includes('mods')) {
              throw new Error('ไม่พบ work/input/mods — ไฟล์นี้น่าจะเป็น CurseForge export ที่มีแค่ manifest/overrides');
            }

            const inclusions = dirs.flatMap((source) => [
              '[[inclusions]]',
              'source = ' + JSON.stringify(source),
              'destination = \"\"',
              'inclusionFilter = \"\"',
              'exclusionFilter = \"\"'
            ]);

            const conf = [
              'modpackDir = ' + JSON.stringify(inputDir),
              'clientMods = []',
              'whitelist = []',
              ...inclusions,
              'minecraftVersion = ' + JSON.stringify(m.minecraft.version),
              'modLoader = ' + JSON.stringify(loaderCap),
              'modLoaderVersion = ' + JSON.stringify(loaderVersion),
              'includeServerIcon = true',
              'includeServerProperties = true',
              'includeZipCreation = true',
              'javaArgs = \"empty\"'
            ].join('\n\n');

            fs.writeFileSync('work/serverpackcreator.conf', conf);
          "

          cat work/serverpackcreator.conf

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download ServerPackCreator JAR
        run: |
          mkdir -p work/spc
          gh release download 8.1.2 \
            --repo Griefed/ServerPackCreator \
            --pattern "*.jar" \
            --dir work/spc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ServerPackCreator
        working-directory: work/spc
        run: |
          set -euo pipefail
          JAR_FILE="$(find . -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$JAR_FILE"

          java -jar "$JAR_FILE" \
            --home "$GITHUB_WORKSPACE/work/spc-home" \
            -config "$GITHUB_WORKSPACE/work/serverpackcreator.conf" \
            --destination "$GITHUB_WORKSPACE/work/output/serverpack"

      - name: Find generated zip
        id: find_zip
        run: |
          ZIP_PATH="$GITHUB_WORKSPACE/work/output/serverpack_server_pack.zip"
          test -s "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload as GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="serverpack-$MODPACK_ID-${{ github.run_id }}"
          gh release create "$TAG" "${{ steps.find_zip.outputs.zip_path }}" \
            --title "Server pack: modpack $MODPACK_ID" \
            --notes "สร้างอัตโนมัติจาก PackME"
          FILENAME=$(basename "${{ steps.find_zip.outputs.zip_path }}")
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Notify PackME backend
        run: |
          curl -X POST "${{ secrets.PACKME_API_URL }}/api/jobs/$JOB_ID/complete" \
            -H "Authorization: Bearer ${{ secrets.PACKME_WORKER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"resultUrl\": \"${{ steps.release.outputs.download_url }}\"}"