name: Generate Server Pack

on:
  repository_dispatch:
    types: [generate-server-pack]
  workflow_dispatch:
    inputs:
      modpack_id:
        description: "modpack id (ใส่อะไรก็ได้ตอนเทส)"
        required: true
      download_url:
        description: "ลิงก์ดาวน์โหลด modpack zip ตรงๆ"
        required: true
      job_id:
        description: "job id (ใส่ test-1 ก็ได้ตอนเทส)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MODPACK_ID: ${{ github.event.inputs.modpack_id || github.event.client_payload.modpack_id }}
      DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url }}
      JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download modpack
        run: |
          mkdir -p work
          curl -L -f \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "$DOWNLOAD_URL" -o work/modpack.zip

      - name: Verify downloaded file
        run: |
          echo "ขนาดไฟล์:"
          ls -lh work/modpack.zip
          echo "ประเภทไฟล์จริง:"
          file work/modpack.zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo install
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mcpacker-${{ runner.os }}

      - name: Install mcpacker
        run: |
          if ! command -v mcpacker &> /dev/null; then
            cargo install mcpacker
          fi

      - name: Run mcpacker
        run: |
          mkdir -p work/output
          mcpacker work/modpack.zip \
            --output work/output \
            --filter-client \
            --accept-eula

      - name: Zip server pack output
        run: |
          cd work/output
          zip -r ../server-pack.zip .
          cd ../..
          echo "ไฟล์ที่ได้:"
          ls -lh work/server-pack.zip

      - name: Upload as GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="serverpack-$MODPACK_ID-${{ github.run_id }}"
          gh release create "$TAG" "work/server-pack.zip" \
            --title "Server pack: modpack $MODPACK_ID" \
            --notes "สร้างอัตโนมัติจาก PackME (แปลงด้วย mcpacker)"
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/server-pack.zip" >> "$GITHUB_OUTPUT"

      - name: Notify PackME backend
        run: |
          curl -X POST "${{ secrets.PACKME_API_URL }}/api/jobs/$JOB_ID/complete" \
            -H "Authorization: Bearer ${{ secrets.PACKME_WORKER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"resultUrl\": \"${{ steps.release.outputs.download_url }}\"}"