name: Generate Server Pack

on:
  repository_dispatch:
    types: [generate-server-pack]
  workflow_dispatch:
    inputs:
      modpack_id:
        description: "modpack id (ใส่อะไรก็ได้ตอนเทส)"
        required: true
      download_url:
        description: "ลิงก์ดาวน์โหลด modpack zip ตรงๆ"
        required: true
      job_id:
        description: "job id (ใส่ test-1 ก็ได้ตอนเทส)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MODPACK_ID: ${{ github.event.inputs.modpack_id || github.event.client_payload.modpack_id }}
      DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url }}
      JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download modpack
        run: |
          mkdir -p work/input work/output
          curl -L -f \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "$DOWNLOAD_URL" -o work/modpack.zip

      - name: Verify downloaded file
        run: |
          echo "ขนาดไฟล์:"
          ls -lh work/modpack.zip
          echo "ประเภทไฟล์จริง:"
          file work/modpack.zip

      - name: Extract modpack
        run: unzip -q work/modpack.zip -d work/input

      - name: Generate SPC config from manifest
        run: |
          node -e "
            const m = require('./work/input/manifest.json');
            const loaderRaw = m.minecraft.modLoaders[0].id; // เช่น 'forge-47.2.0'
            const [loaderName, ...verParts] = loaderRaw.split('-');
            const loaderVersion = verParts.join('-');
            const loaderCap = loaderName.charAt(0).toUpperCase() + loaderName.slice(1);
            const conf = [
              'modpackDir = \"/data/input\"',
              'clientMods = []',
              'copyDirs = [config, mods, scripts, defaultconfigs]',
              'includeServerInstallation = true',
              'minecraftVersion = \"' + m.minecraft.version + '\"',
              'modLoader = \"' + loaderCap + '\"',
              'modLoaderVersion = \"' + loaderVersion + '\"',
              'includeServerIcon = true',
              'includeServerProperties = true',
              'includeStartScripts = true',
              'includeZipCreation = true',
              'javaArgs = \"empty\"',
            ].join('\n');
            require('fs').writeFileSync('work/serverpackcreator.conf', conf);
          "
          echo "----- config ที่สร้างได้ -----"
          cat work/serverpackcreator.conf

      - name: Run ServerPackCreator (CLI mode)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/work/input:/data/input \
            -v ${{ github.workspace }}/work/serverpackcreator.conf:/app/serverpackcreator/serverpackcreator.conf \
            -v ${{ github.workspace }}/work/output:/app/serverpackcreator/server-packs \
            griefed/serverpackcreator:latest -cli

      - name: Find generated zip
        id: find_zip
        run: echo "zip_path=$(find work/output -name '*.zip' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload as GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="serverpack-$MODPACK_ID-${{ github.run_id }}"
          gh release create "$TAG" "${{ steps.find_zip.outputs.zip_path }}" \
            --title "Server pack: modpack $MODPACK_ID" \
            --notes "สร้างอัตโนมัติจาก PackME"
          FILENAME=$(basename "${{ steps.find_zip.outputs.zip_path }}")
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Notify PackME backend
        run: |
          curl -X POST "${{ secrets.PACKME_API_URL }}/api/jobs/$JOB_ID/complete" \
            -H "Authorization: Bearer ${{ secrets.PACKME_WORKER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"resultUrl\": \"${{ steps.release.outputs.download_url }}\"}"